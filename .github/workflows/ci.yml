name: CAPI tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: capi-tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: CAPI fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Set up Rust and Cargo
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Prepare repository-local working directory
        run: install -d -m 700 .tools .runtime

      - name: Acquire pinned admin build tools
        run: just cache admin-build

      - name: Run unit and static tests
        run: |
          just test-unit
          just test-static

      - name: Validate Azure operator contracts
        run: just test-azure-operator-contracts

      - name: Fetch locked controller dependencies
        run: just controller-fetch

      - name: Verify generated controller artifacts
        run: just controller-verify

      - name: Lint Tenant controller
        run: just controller-lint

      - name: Test Tenant controller
        run: |
          just controller-test
          just controller-metrics

      - name: Build static Tenant controller
        run: just controller-build

      - name: Verify, lint, test and measure database controller
        run: |
          just database-controller-verify
          just database-controller-lint
          just database-controller-test
          just database-controller-metrics

      - name: Build static database controller
        run: just database-controller-build

      - name: Fetch locked admin dependencies
        run: just admin-fetch

      - name: Verify generated admin resources
        run: just admin-generate-check

      - name: Lint Tenant Admin
        env:
          CAPI_OFFLINE_ENFORCED: "1"
        run: just admin-lint

      - name: Test and measure Tenant Admin
        env:
          CAPI_OFFLINE_ENFORCED: "1"
        run: |
          just admin-test
          just admin-metrics

      - name: Build reproducible static Tenant Admin package
        env:
          CAPI_OFFLINE_ENFORCED: "1"
        run: just admin-package-check

      - name: Stage prebuilt controller, database controller and admin artifacts
        run: |
          install -d -m 700 .runtime/rendered/ci-artifact/admin/web
          install -m 700 .runtime/rendered/controller/manager .runtime/rendered/ci-artifact/manager
          install -m 700 target/release/manager .runtime/rendered/ci-artifact/database-manager
          install -m 700 .runtime/rendered/admin/tenant-admin .runtime/rendered/ci-artifact/admin/tenant-admin
          install -m 600 .runtime/rendered/admin/web/* .runtime/rendered/ci-artifact/admin/web/

      - name: Upload static controller and Tenant Admin
        uses: actions/upload-artifact@v6
        with:
          name: controller-manager-${{ github.sha }}
          path: .runtime/rendered/ci-artifact/
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: CAPI end-to-end
    needs: fast-checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MIN_DOCKER_CPUS: "4"
      MIN_DOCKER_MEMORY_GIB: "10"
      MIN_DOCKER_STORAGE_GIB: "12"
      PYTHONUNBUFFERED: "1"
      CAPI_PREBUILT_CONTROLLER_BINARY: ${{ github.workspace }}/.tools/artifacts/${{ github.sha }}/manager
      CAPI_PREBUILT_DATABASE_CONTROLLER_BINARY: ${{ github.workspace }}/.tools/artifacts/${{ github.sha }}/database-manager
      CAPI_PREBUILT_ADMIN_SERVER: ${{ github.workspace }}/.tools/artifacts/${{ github.sha }}/admin/tenant-admin
      CAPI_PREBUILT_ADMIN_WEB: ${{ github.workspace }}/.tools/artifacts/${{ github.sha }}/admin/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Set up Rust and Cargo
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Prepare repository-local working directory
        run: install -d -m 700 .tools .runtime

      - name: Restore verified CAPI cache
        uses: actions/cache@v6
        with:
          path: .tools/cache
          key: capi-full-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'config/versions.env', 'config/settings.env', 'config/kind.yaml', 'manifests/**', 'scripts/cache.py', 'scripts/tools.py') }}

      - name: Download static controller and Tenant Admin
        uses: actions/download-artifact@v7
        with:
          name: controller-manager-${{ github.sha }}
          path: .tools/artifacts/${{ github.sha }}

      - name: Show Docker capacity
        run: docker info --format 'CPUs={{.NCPU}} Memory={{.MemTotal}} DockerRoot={{.DockerRootDir}}'

      - name: Acquire pinned tools and images
        run: just cache

      - name: Run end-to-end test
        run: just test-e2e-offline

      - name: Diagnose failed end-to-end
        if: failure()
        continue-on-error: true
        run: |
          set +e
          if test -f .runtime/management/kubeconfig; then
            kubectl=(
              .tools/bin/kubectl
              --kubeconfig .runtime/management/kubeconfig
              --context kind-capi-kamaji-management
              --request-timeout 30s
            )
            "${kubectl[@]}" -n tenant-system get deployments,pods -o wide
            "${kubectl[@]}" -n default get lease/database-controller.tenancy.cnpg-vcluster.io -o yaml
            "${kubectl[@]}" -n tenant-system logs deployment/database-controller --all-pods=true --tail=200
            "${kubectl[@]}" -n tenant-system logs deployment/tenant-controller --all-pods=true --tail=200
            "${kubectl[@]}" get tenants.tenancy.cnpg-vcluster.io -o yaml
            "${kubectl[@]}" get tenantdatabasecatalogs.tenancy.cnpg-vcluster.io -A -o yaml
            "${kubectl[@]}" -n tenant-system get events --sort-by=.lastTimestamp
          fi

  high-capacity:
    name: CAPI high-capacity offline and targeted
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MIN_DOCKER_CPUS: "4"
      MIN_DOCKER_MEMORY_GIB: "10"
      MIN_DOCKER_STORAGE_GIB: "20"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - name: Set up Rust and Cargo
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Prepare repository-local working directory
        run: install -d -m 700 .tools .runtime
      - name: Restore verified CAPI cache
        uses: actions/cache@v6
        with:
          path: .tools/cache
          key: capi-full-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'config/versions.env', 'config/settings.env', 'config/kind.yaml', 'manifests/**', 'scripts/cache.py', 'scripts/tools.py') }}
      - name: Show Docker capacity
        run: docker info --format 'CPUs={{.NCPU}} Memory={{.MemTotal}} DockerRoot={{.DockerRootDir}}'
      - name: Acquire complete verified cache
        run: just cache
      - name: Install pinned tools
        run: just tools
      - name: Prepare host
        run: just prepare-host
      - name: Create management cluster
        run: just create-management
      - name: Run targeted live suites and enforced-offline end-to-end
        run: |
          just test-controller-convergence
          just test-controller-readiness
          just test-controller-deletion
          just test-endpoint
          just test-endpoint-negative
          just test-spike
          just test-network-negative
          just test-machines
          just test-storage
          just test-storage-negative
          just test-persistence
          just test-persistence-negative
          just test-tenant-lifecycle
          just test-e2e-offline
      - name: Clean up high-capacity environment
        if: always()
        run: just destroy

  capi-tests:
    name: CAPI tests
    if: always()
    needs: [fast-checks, e2e, high-capacity]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          FAST_RESULT: ${{ needs.fast-checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          HIGH_CAPACITY_RESULT: ${{ needs.high-capacity.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$FAST_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$E2E_RESULT" = success
            test "$HIGH_CAPACITY_RESULT" = skipped
          elif [ "$EVENT_NAME" = push ]; then
            test "$E2E_RESULT" = skipped
            test "$HIGH_CAPACITY_RESULT" = skipped
          else
            test "$E2E_RESULT" = skipped
            test "$HIGH_CAPACITY_RESULT" = success
          fi
