name: CAPI tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

env:
  TMPDIR: ${{ github.workspace }}/capi/.tools/cargo-work

concurrency:
  group: capi-tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: CAPI fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: capi
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Prepare repository-local working directory
        run: install -d -m 700 .tools/cargo-work

      - name: Run unit and static tests
        run: |
          just test-unit
          just test-static

      - name: Identify system Rust compiler
        id: compiler
        run: echo "identity=$(rustc -vV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Prepare owner-only Cargo cache
        run: |
          umask 077
          mkdir -p .tools/cargo-home

      - name: Cache locked Cargo dependencies
        uses: actions/cache@v4
        with:
          path: capi/.tools/cargo-home
          key: controller-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('capi/controller/Cargo.lock') }}

      - name: Fetch locked controller dependencies
        run: just controller-fetch

      - name: Verify and test Tenant controller
        run: |
          just controller-verify
          just controller-lint
          just controller-test
          just controller-build

  e2e:
    name: CAPI end-to-end
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MIN_DOCKER_CPUS: "2"
      MIN_DOCKER_MEMORY_GIB: "6"
      MIN_DOCKER_STORAGE_GIB: "10"
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        working-directory: capi

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Prepare repository-local working directory
        run: install -d -m 700 .tools/cargo-work

      - name: Identify system Rust compiler
        id: compiler
        run: echo "identity=$(rustc -vV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Prepare owner-only Cargo cache
        run: |
          umask 077
          mkdir -p .tools/cargo-home

      - name: Restore locked Cargo dependencies
        uses: actions/cache/restore@v4
        with:
          path: capi/.tools/cargo-home
          key: controller-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('capi/controller/Cargo.lock') }}

      - name: Show Docker capacity
        run: docker info --format 'CPUs={{.NCPU}} Memory={{.MemTotal}} DockerRoot={{.DockerRootDir}}'

      - name: Acquire pinned tools and images
        run: just cache

      - name: Run end-to-end test
        run: just test-e2e

  high-capacity:
    name: CAPI high-capacity offline and targeted
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MIN_DOCKER_CPUS: "4"
      MIN_DOCKER_MEMORY_GIB: "10"
      MIN_DOCKER_STORAGE_GIB: "20"
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        working-directory: capi
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - name: Prepare repository-local working directory
        run: install -d -m 700 .tools/cargo-work
      - name: Show Docker capacity
        run: docker info --format 'CPUs={{.NCPU}} Memory={{.MemTotal}} DockerRoot={{.DockerRootDir}}'
      - name: Acquire complete cache including locked Cargo inputs
        run: just cache
      - name: Install pinned tools
        run: just tools
      - name: Prepare host
        run: just prepare-host
      - name: Create management cluster
        run: just create-management
      - name: Run targeted live suites and enforced-offline end-to-end
        run: |
          just test-controller-convergence
          just test-controller-readiness
          just test-controller-deletion
          just test-endpoint
          just test-endpoint-negative
          just test-spike
          just test-network-negative
          just test-machines
          just test-storage
          just test-storage-negative
          just test-persistence
          just test-persistence-negative
          just test-tenant-lifecycle
          just test-e2e-offline
      - name: Clean up high-capacity environment
        if: always()
        run: just destroy

  capi-tests:
    name: CAPI tests
    if: always()
    needs: [fast-checks, e2e, high-capacity]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          FAST_RESULT: ${{ needs.fast-checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          HIGH_CAPACITY_RESULT: ${{ needs.high-capacity.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$FAST_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$E2E_RESULT" = success
            test "$HIGH_CAPACITY_RESULT" = skipped
          elif [ "$EVENT_NAME" = push ]; then
            test "$E2E_RESULT" = skipped
            test "$HIGH_CAPACITY_RESULT" = skipped
          else
            test "$E2E_RESULT" = skipped
            test "$HIGH_CAPACITY_RESULT" = success
          fi
