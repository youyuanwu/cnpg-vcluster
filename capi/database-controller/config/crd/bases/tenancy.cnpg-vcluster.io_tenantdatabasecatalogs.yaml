          rule: oldSelf.spec.entries.all(uid, !(uid in self.spec.entries) || (self.spec.entries[uid].name == oldSelf.spec.entries[uid].name && self.spec.entries[uid].instances == oldSelf.spec.entries[uid].instances && (!oldSelf.spec.entries[uid].deleting || self.spec.entries[uid].deleting)))
