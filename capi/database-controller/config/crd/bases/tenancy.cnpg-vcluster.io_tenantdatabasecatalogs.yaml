          rule: self.metadata.name == self.spec.tenantName
        - message: Tenant name must be a lowercase DNS label
          rule: self.spec.tenantName.matches('^[a-z0-9]([-a-z0-9]{0,28}[a-z0-9])?$')
        - message: Tenant UID must be nonempty
          rule: size(self.spec.tenantUID) > 0
        - message: logical UIDs, names and instance counts must be valid
          rule: self.spec.entries.all(uid, uid.matches('^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$') && self.spec.entries[uid].name.matches('^[a-z0-9]([-a-z0-9]{0,28}[a-z0-9])?$') && self.spec.entries[uid].instances >= 1 && self.spec.entries[uid].instances <= 3)
        - message: database names must be unique
          rule: self.spec.entries.all(uid, self.spec.entries.filter(otherUID, self.spec.entries[otherUID].name == self.spec.entries[uid].name).size() == 1)
        - message: Tenant identity is immutable
          rule: self.spec.tenantName == oldSelf.spec.tenantName && self.spec.tenantUID == oldSelf.spec.tenantUID
