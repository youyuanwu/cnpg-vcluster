apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tenant-controller-serving-cert
  namespace: tenant-system
spec:
  dnsNames:
  - tenant-controller-webhook.tenant-system.svc
  - tenant-controller-webhook.tenant-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: tenant-controller-selfsigned
  secretName: tenant-controller-serving-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: tenant-controller-selfsigned
  namespace: tenant-system
spec:
  selfSigned: {}
