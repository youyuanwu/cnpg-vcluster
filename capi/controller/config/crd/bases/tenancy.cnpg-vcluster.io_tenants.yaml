---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.tenancy.cnpg-vcluster.io
spec:
  group: tenancy.cnpg-vcluster.io
  names:
    kind: Tenant
    plural: tenants
    shortNames:
    - tn
    singular: tenant
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.provider.allocation.endpoint
      name: Endpoint
      type: string
    - jsonPath: .spec.workers
      name: Workers
      type: integer
    - jsonPath: .spec.provider.databases
      name: Databases
      type: integer
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for TenantSpec via `CustomResource`
        properties:
          spec:
            properties:
              kubernetesVersion:
                pattern: ^v?[0-9]+\.[0-9]+\.[0-9]+$
                type: string
              provider:
                properties:
                  databases:
                    format: int32
                    maximum: 3.0
                    minimum: 1.0
                    nullable: true
                    type: integer
                  podCIDR:
                    nullable: true
                    pattern: ^([0-9]{1,3}[.]){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$
                    type: string
                  serviceCIDR:
                    nullable: true
                    pattern: ^([0-9]{1,3}[.]){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$
                    type: string
                  type:
                    enum:
                    - local
                    - azure
                    type: string
                required:
                - type
                type: object
              workers:
                format: int32
                maximum: 3.0
                minimum: 1.0
                type: integer
            required:
            - kubernetesVersion
            - provider
            - workers
            type: object
          status:
            nullable: true
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              phase:
                enum:
                - Pending
                - Progressing
                - Ready
                - Deleting
                - Degraded
                - Failed
                - OwnershipInvalid
                - null
                nullable: true
                type: string
              provider:
                nullable: true
                properties:
                  allocation:
                    nullable: true
                    properties:
                      endpoint:
                        type: string
                      podCIDR:
                        type: string
                      serviceCIDR:
                        type: string
                      slotId:
                        type: string
                    required:
                    - endpoint
                    - podCIDR
                    - serviceCIDR
                    - slotId
                    type: object
                  clusterUID:
                    nullable: true
                    type: string
                  foundation_hash:
                    nullable: true
                    type: string
                  type:
                    enum:
                    - local
                    - azure
                    type: string
                required:
                - type
                type: object
            type: object
        required:
        - spec
        title: Tenant
        type: object
        x-kubernetes-validations:
        - message: Tenant spec is immutable
          rule: self.spec == oldSelf.spec
        - message: Tenant name must be a 1-30 character lowercase DNS label
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]{0,28}[a-z0-9])?$')
        - message: workers must be between 1 and 3
          rule: self.spec.workers >= 1 && self.spec.workers <= 3
        - message: provider fields must match the selected local or Azure provider
          rule: 'self.spec.provider.type == ''local'' ? has(self.spec.provider.databases) && !has(self.spec.provider.podCIDR) && !has(self.spec.provider.serviceCIDR) : !has(self.spec.provider.databases) && has(self.spec.provider.podCIDR) && has(self.spec.provider.serviceCIDR)'
        - message: Azure Pod and Service CIDRs must be disjoint IPv4 networks and the Service CIDR must contain the derived DNS address
          rule: self.spec.provider.type != 'azure' || (isCIDR(self.spec.provider.podCIDR) && isCIDR(self.spec.provider.serviceCIDR) && cidr(self.spec.provider.podCIDR).ip().family() == 4 && cidr(self.spec.provider.serviceCIDR).ip().family() == 4 && !cidr(self.spec.provider.podCIDR).containsCIDR(cidr(self.spec.provider.serviceCIDR)) && !cidr(self.spec.provider.serviceCIDR).containsCIDR(cidr(self.spec.provider.podCIDR)) && cidr(self.spec.provider.serviceCIDR).prefixLength() <= 28)
        - message: Tenant provider status must match the requested provider
          rule: '!has(self.status) || !has(self.status.provider) || self.status.provider.type == self.spec.provider.type'
        - message: Azure provider status cannot contain local durable identity
          rule: '!has(self.status) || !has(self.status.provider) || self.status.provider.type != ''azure'' || (!has(self.status.provider.allocation) && !has(self.status.provider.foundationHash) && !has(self.status.provider.clusterUID))'
        - message: kubernetesVersion must be a three-component numeric version
          rule: self.spec.kubernetesVersion.matches('^v?[0-9]+[.][0-9]+[.][0-9]+$')
    served: true
    storage: true
    subresources:
      status: {}
