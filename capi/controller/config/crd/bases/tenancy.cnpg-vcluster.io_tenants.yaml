---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.tenancy.cnpg-vcluster.io
spec:
  group: tenancy.cnpg-vcluster.io
  names:
    kind: Tenant
    plural: tenants
    shortNames:
    - tn
    singular: tenant
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.allocation.endpoint
      name: Endpoint
      type: string
    - jsonPath: .spec.workers
      name: Workers
      type: integer
    - jsonPath: .spec.databases
      name: Databases
      type: integer
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for TenantSpec via `CustomResource`
        properties:
          spec:
            properties:
              databases:
                format: int32
                maximum: 3.0
                minimum: 1.0
                type: integer
              kubernetesVersion:
                pattern: ^v?[0-9]+\.[0-9]+\.[0-9]+$
                type: string
              workers:
                format: int32
                maximum: 3.0
                minimum: 1.0
                type: integer
            required:
            - databases
            - kubernetesVersion
            - workers
            type: object
          status:
            nullable: true
            properties:
              allocation:
                nullable: true
                properties:
                  endpoint:
                    type: string
                  podCIDR:
                    type: string
                  serviceCIDR:
                    type: string
                  slotId:
                    type: string
                required:
                - endpoint
                - podCIDR
                - serviceCIDR
                - slotId
                type: object
              clusterUID:
                nullable: true
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              foundationHash:
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              phase:
                enum:
                - Pending
                - Progressing
                - Ready
                - Deleting
                - Degraded
                - Failed
                - OwnershipInvalid
                - null
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: Tenant
        type: object
        x-kubernetes-validations:
        - message: Tenant spec is immutable
          rule: self.spec == oldSelf.spec
        - message: Tenant name must be a 1-30 character lowercase DNS label
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]{0,28}[a-z0-9])?$')
        - message: workers and databases must each be between 1 and 3
          rule: self.spec.workers >= 1 && self.spec.workers <= 3 && self.spec.databases >= 1 && self.spec.databases <= 3
        - message: kubernetesVersion must be a three-component numeric version
          rule: self.spec.kubernetesVersion.matches('^v?[0-9]+[.][0-9]+[.][0-9]+$')
    served: true
    storage: true
    subresources:
      status: {}
