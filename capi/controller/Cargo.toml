[package]
name = "tenant-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
bollard = { version = "=0.21.1", default-features = false, features = ["pipe"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures = "0.3"
hex = "0.4"
ipnet = { version = "2", features = ["serde"] }
k8s-openapi = { version = "=0.28.0", features = ["v1_36", "schemars"] }
kube = { version = "=4.2.0", features = ["derive", "runtime", "rustls-tls"] }
kube-lease-manager = "=0.12.0"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
